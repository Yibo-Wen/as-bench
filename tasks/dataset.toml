# Dataset manifest for as-bench/as-bench.
#
# This file is the ALLOWLIST of what ships in the published dataset: a task in
# tasks/ that is not listed here is not in the benchmark.
#
# Tasks nest as tasks/<domain>/<source>/<campaign>, the same depth as
# terminal-bench-science, so the same Harbor recipes apply. Generate or refresh
# entries (this also writes each task's content digest):
#
#   harbor add tasks/*/*/ --scan --to tasks
#
# Publish tasks first, then the dataset:
#
#   harbor publish tasks/*/*/
#   harbor publish tasks/ --no-tasks -t v0.1-preview
#
# Digests must be refreshed after ANY change to a task's hashed files
# (task.toml, README.md, instruction.md, environment/, tests/, solution/),
# including a re-run of tools/vendor_runtime.py that changes vendored copies.
# `uv run python tools/update_digests.py` rewrites them (--check fails if stale).

[dataset]
name = "as-bench/as-bench"
description = "Autonomous Science Bench: AI agents run bounded, budgeted design-build-test-learn campaigns against replays and digital twins of published experiments."
keywords = ["benchmark", "agents", "ai-for-science", "autonomous-labs", "active-learning", "experimental-design"]
[[dataset.authors]]
name = "Autonomous Science Bench Team"
email = "yibo@u.northwestern.edu"


