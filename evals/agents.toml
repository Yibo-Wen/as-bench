# --- xAI · Grok Build -----------------------------------------------------------
[presets."grok-4.7"]
agent = "grok-build"
model = "grok-4.7"
kwargs = { reasoning_effort = "xhigh" }

[presets."grok-4.6"]
agent = "grok-build"
model = "grok-4.6"
kwargs = { reasoning_effort = "xhigh" }

# --- Google · mini-SWE-agent ----------------------------------------------------
[presets."gemini-3.8-flash"]
agent = "mini-swe-agent"
model = "gemini/gemini-3.8-flash"
kwargs = { reasoning_effort = "high" }

[presets."gemini-3.7-flash"]
agent = "mini-swe-agent"
model = "gemini/gemini-3.7-flash"
kwargs = { reasoning_effort = "high" }

# --- DeepSeek · Codex against DeepSeek's Responses endpoint ---------------------
# "deepseek-flash" is DeepSeek V4.1 Flash.
[presets."deepseek-v4.1-flash"]
agent = "codex"
model = "deepseek-flash"
kwargs = { reasoning_effort = "max", version = "0.162.1" }
env = { OPENAI_BASE_URL = "https://api.deepseek.com", OPENAI_API_KEY = "${DEEPSEEK_API_KEY}" }

[presets."deepseek-v4-pro"]
agent = "codex"
model = "deepseek-v4-pro"
kwargs = { reasoning_effort = "max", version = "0.162.1" }
env = { OPENAI_BASE_URL = "https://api.deepseek.com", OPENAI_API_KEY = "${DEEPSEEK_API_KEY}" }

# --- Z.ai and Moonshot · Claude Code against their Anthropic-compatible endpoints ---
[presets."glm-5.3"]
agent = "claude-code"
model = "glm-5.3"
kwargs = { reasoning_effort = "max" }
env = { ANTHROPIC_BASE_URL = "https://api.z.ai/api/anthropic", ANTHROPIC_API_KEY = "${ZAI_API_KEY}", ANTHROPIC_AUTH_TOKEN = "${ZAI_API_KEY}" }

[presets."kimi-k3"]
agent = "claude-code"
model = "kimi-k3"
kwargs = { reasoning_effort = "max" }
env = { ANTHROPIC_BASE_URL = "https://api.moonshot.ai/anthropic", ANTHROPIC_API_KEY = "${MOONSHOT_API_KEY}", ANTHROPIC_AUTH_TOKEN = "${MOONSHOT_API_KEY}" }

# --- Small open-weight models · mini-SWE-agent via OpenRouter (one key) ----------
# Open-weight models through OpenRouter on the mini-swe-agent harness. Slugs are exact:
# OpenRouter has no bare "qwen/qwen3.8-max", only the dated snapshot -0902 and the
# separate -prime variant, and the snapshot is half the price.
[presets."deepseek-v4.1-flash-mswea"]
agent = "mini-swe-agent"
model = "openrouter/deepseek/deepseek-v4.1-flash"

# max_tokens is capped because OpenRouter pre-authorises a request against its maximum
# possible cost, not its actual cost: on the outside-the-libraries round, where the
# catalog is 100,034 rows and the prediction file is 2.4 MB, an uncapped request on this
# model priced above the account's remaining balance and came back 402 ("This request's
# maximum cost exceeds your available credits ... or lower max_tokens or prompt size")
# while $10.21 was still available. Capping the ceiling is what makes the call priceable.
[presets."qwen3.8-max"]
agent = "mini-swe-agent"
model = "openrouter/qwen/qwen3.8-max-0902"
kwargs = { max_tokens = 16000 }

[presets."qwen3.8-27b"]
agent = "mini-swe-agent"
model = "openrouter/qwen/qwen3.8-27b"

[presets."glm-5.3-flash"]
agent = "mini-swe-agent"
model = "openrouter/z-ai/glm-5.3-flash"

[presets."minimax-m3"]
agent = "mini-swe-agent"
model = "openrouter/minimax/minimax-m3"

# --- Fixed harness: several models under the same scaffold (mini-SWE-agent) -----
[presets."mswea-claude-haiku-4.5"]
agent = "mini-swe-agent"
model = "anthropic/claude-haiku-4-5-20251001"

[presets."mswea-gpt-5.6-luna"]
agent = "mini-swe-agent"
model = "openai/gpt-5.6-luna"
kwargs = { reasoning_effort = "high" }

[suites]
sanity = ["oracle", "nop"]
# Cheapest capable models: start here.
small = ["claude-haiku-4.5", "gpt-5.6-luna", "gemini-3.8-flash", "deepseek-v4.1-flash"]
open-small = ["qwen3.8-27b", "glm-5.3-flash", "minimax-m3"]
mid = ["claude-sonnet-5.5", "gpt-5.6-terra", "grok-4.7", "glm-5.3", "kimi-k3", "deepseek-v4-pro"]
frontier = ["gpt-6-astra", "claude-opus-5.5", "claude-fable-5.1", "gpt-5.6-sol"]
# Every leaderboard entry we can reproduce (Opus 5 and Fable 5 are superseded and omitted).
tbs-leaderboard = [
    "gpt-6-astra", "claude-opus-5.5", "claude-fable-5.1", "gpt-5.6-sol", "deepseek-v4.1-flash",
    "grok-4.7", "gemini-3.8-flash", "claude-opus-4.8", "gpt-5.6-terra", "glm-5.3", "kimi-k3",
    "grok-4.6", "gemini-3.7-flash", "deepseek-v4-pro", "gpt-5.6-luna",
]
harness = ["mswea-claude-haiku-4.5", "mswea-gpt-5.6-luna", "gemini-3.8-flash"]
