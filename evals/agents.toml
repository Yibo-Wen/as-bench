# Agent × model presets for Autonomous Science Bench evaluation runs.
#
# Same idea as terminal-bench-science's .github/llm-config.yml (`harbor_run.agents`):
# each preset is one Harbor agent + one model, plus optional agent kwargs and
# environment variables. Suites group presets you usually run together.
#
#   uv run python evals/run.py --suite small -k 3 --env modal
#   uv run python evals/run.py --list
#
# Agent + reasoning-effort pairings follow the Terminal-Bench-Science 0.1
# leaderboard (snorkel.ai/leaderboard/terminal-bench-science, Sept 2026), so
# Autonomous Science Bench numbers can be read against it.
#
# Codex CLI version: the pin is 0.162.1, and it is load-bearing. 0.146.1 refuses
# gpt-6-astra outright ("requires a newer version of Codex"). 0.154.0 serves astra but
# not gpt-6-sol or gpt-6.1-sol: it does not know their metadata, and the request it then
# builds comes back as "not supported when using Codex with a ChatGPT account", which
# reads like an entitlement problem and is not one. 0.162.1 serves all three.
#
# Codex reasoning effort "max" is real, and the CLI version decides whether it is. The CLI
# never validates the value, it echoes back whatever it is given, so a value the server
# declines is silent. Measured on 0.162.1, same prompt, tokens spent over three repeats:
# medium 6.0-6.8k, high 11.0-11.9k, max 11.4-19.6k, xhigh 6.1k, ultra 6.3k. So high and
# max are both honoured and max reasons at least as hard; xhigh and ultra are the values
# that quietly fall back to the default. On 0.154.0 "max" fell back to 591 tokens, which
# is what makes the version pin above load-bearing for the effort setting too.
#
# Model names:
#   * Vendor CLIs (claude-code, codex, grok-build) take the vendor's bare model id.
#     Keep Claude ids bare: with ANTHROPIC_BASE_URL set, claude-code passes the
#     name through verbatim.
#   * LiteLLM harnesses (mini-swe-agent, terminus-2) need "<provider>/<model>".
#
# Credentials: never put secrets here. Reference them as "${VAR}"; Harbor
# resolves them from your shell or .env at run time, and the preset's value
# overrides the host variable of the same name (so a GLM preset cannot send your
# Anthropic key to z.ai). evals/run.py checks every referenced variable first.

# --- sanity -----------------------------------------------------------------
[presets.oracle]
agent = "oracle"
description = "Runs solution/solve.sh; expect reward 1."

[presets.nop]
agent = "nop"
description = "Does nothing; expect reward 0."

# --- Anthropic · Claude Code ------------------------------------------------------
[presets."claude-fable-5.1"]
agent = "claude-code"
model = "claude-fable-5-1"
kwargs = { reasoning_effort = "max" }
env = { CLAUDE_CODE_MAX_OUTPUT_TOKENS = "128000" }

[presets."claude-opus-5.5"]
agent = "claude-code"
model = "claude-opus-5-5"
kwargs = { reasoning_effort = "max" }
env = { CLAUDE_CODE_MAX_OUTPUT_TOKENS = "128000" }

# Superseded by claude-opus-5.5 and so absent from the leaderboard suites below, but
# kept callable: it is the model this repository's campaigns were authored against, so a
# preset for it makes an authoring run reproducible rather than an ad-hoc -m flag.
[presets."claude-opus-5"]
agent = "claude-code"
model = "claude-opus-5"
kwargs = { reasoning_effort = "max" }
env = { CLAUDE_CODE_MAX_OUTPUT_TOKENS = "128000" }

# Probes: whether a "Sonnet 5" and a "Fable 5" exist as models distinct from the 5.5 and
# 5.1 in this family. Kept only if the API serves them; an invalid-model error means the
# family has no such entry and these come back out.
# Probes for whether the refusal depends on the claude-code build rather than on the
# task. The CLI injects its own system prompt, 22 tools and 17 skills into every request,
# and the classifier sees the whole request, so a different build is a different request.
# A failure on an unsupported flag is a harness result, not a classifier result, and is
# reported as such.
[presets."claude-opus-5-cli2.1.287"]
agent = "claude-code"
model = "claude-opus-5"
kwargs = { reasoning_effort = "max", version = "2.1.287" }

# No reasoning_effort: Harbor turns it into `--effort`, which 2.0.x does not know, and
# the run dies on the flag before reaching the API. Dropping it is what makes the old
# build testable at all.
[presets."claude-opus-5-cli2.0.77"]
agent = "claude-code"
model = "claude-opus-5"
kwargs = { version = "2.0.77" }

[presets."claude-opus-5-cli1.0.128"]
agent = "claude-code"
model = "claude-opus-5"
kwargs = { version = "1.0.128" }

[presets."claude-sonnet-5-probe"]
agent = "claude-code"
model = "claude-sonnet-5"
kwargs = { reasoning_effort = "max" }

[presets."claude-fable-5-probe"]
agent = "claude-code"
model = "claude-fable-5"
kwargs = { reasoning_effort = "max" }

[presets."claude-sonnet-5.5"]
agent = "claude-code"
model = "claude-sonnet-5-5"
kwargs = { reasoning_effort = "high" }

[presets."claude-opus-4.8"]
agent = "claude-code"
model = "claude-opus-4-8"
kwargs = { reasoning_effort = "max" }

[presets."claude-haiku-4.5"]
agent = "claude-code"
model = "claude-haiku-4-5-20251001"

