[presets."gpt-6-sol"]
agent = "codex"
model = "gpt-6-sol"
kwargs = { reasoning_effort = "max", version = "0.162.1" }

[presets."gpt-5.6-sol"]
agent = "codex"
model = "gpt-5.6-sol"
kwargs = { reasoning_effort = "max", version = "0.162.1" }

[presets."gpt-5.6-terra"]
agent = "codex"
model = "gpt-5.6-terra"
kwargs = { reasoning_effort = "max", version = "0.162.1" }

[presets."gpt-5.6-luna"]
agent = "codex"
model = "gpt-5.6-luna"
